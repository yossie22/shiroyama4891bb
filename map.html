<!DOCTYPE html>
<html lang="ja">
<head>
<title>VRツアーマップ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; min-height: -webkit-fill-available; overflow: hidden; background: #222; }
.map-container { width: 100vw; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; background: #222; overflow: hidden; }
.map-stage { position: relative; display: block; max-width: 100vw; max-height: 100vh; max-height: 100dvh; line-height: 0; overflow: visible; }
.map-image { display: block; max-width: 100vw; max-height: 100vh; max-height: 100dvh; width: auto; height: auto; }
.overlay-text { position: absolute; z-index: 5; pointer-events: none; }
.main-title { font-size: 36px; color: #ffffff; font-weight: bold; font-family: 'Yu Mincho','YuMincho','Hiragino Mincho ProN','MS PMincho',serif; text-shadow: 0 0 10px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.76), 0 0 30px rgba(0,0,0,0.57), 0 0 40px rgba(0,0,0,0.38); line-height: 1.25; margin-bottom: 10px; text-align: left; }
.desc-text { font-size: 18px; color: #ffffff; font-family: 'Yu Mincho','YuMincho','Hiragino Mincho ProN','MS PMincho',serif; text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.7200000000000001), 0 0 30px rgba(0,0,0,0.54), 0 0 40px rgba(0,0,0,0.36000000000000004); white-space: pre-wrap; line-height: 1.7; text-align: left; }
.map-entry-pin { position: absolute; transform: translate(-50%, -50%); -webkit-transform: translate(-50%, -50%); z-index: 15; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: normal; }
.map-entry-pin:hover { z-index: 40; }
.map-entry-pin:hover .map-entry-dot { transform: scale(1.1); -webkit-transform: scale(1.1); }
.map-entry-dot { width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.55); font-family: sans-serif; line-height: 1.05; text-align: center; transition: transform 0.15s; -webkit-text-size-adjust: 100%; }
.map-entry-label { display: block; margin-top: 3px; background: transparent; color: #ffff80; font-size: 12px; font-weight: bold; padding: 0 2px; border-radius: 0; white-space: normal; word-break: break-word; overflow-wrap: break-word; max-width: 9em; line-height: 1.35; text-align: center; font-family: Meiryo, sans-serif; pointer-events: none; -webkit-text-size-adjust: 100%; text-shadow: 0 0 3px #000, 0 0 6px #000, 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000; }
.map-entry-label.is-bottom { transform: none; -webkit-transform: none; }
.map-entry-label.is-right { transform: translate(55px, -26px); -webkit-transform: translate(55px, -26px); white-space: nowrap; max-width: none; text-align: left; }
.map-entry-label.is-left { transform: translate(-55px, -26px); -webkit-transform: translate(-55px, -26px); white-space: nowrap; max-width: none; text-align: right; }
.map-entry-label.is-top { transform: translate(0, -48px); -webkit-transform: translate(0, -48px); }
.help-button { position: fixed; right: 14px; top: 14px; z-index: 50; background: rgba(255,226,106,0.94); color: #111; font-weight: bold; font-size: 15px; text-decoration: none; padding: 9px 14px; border-radius: 999px; box-shadow: 0 3px 12px rgba(0,0,0,0.45); font-family: sans-serif; }
#passGate {
  position: fixed; inset: 0; z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  background: #0b0f14; padding: 24px; transition: opacity 0.25s ease;
}
#passGate.is-open { opacity: 0; pointer-events: none; }
.pass-gate-card {
  width: 100%; max-width: 360px; background: #162028;
  border: 1px solid #2a3a46; border-radius: 16px;
  padding: 28px 22px 24px; color: #e8eef3; text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.pass-gate-card h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 10px; }
.pass-gate-card p { font-size: 0.95rem; color: #aebac4; margin: 0 0 18px; }
#passGateInput {
  width: 100%; font-size: 1.15rem; padding: 14px; border-radius: 10px;
  border: 1px solid #3a4d5a; background: #0f161c; color: #fff;
  text-align: center; margin-bottom: 14px; outline: none; -webkit-appearance: none;
}
#passGateBtn {
  width: 100%; font-size: 1.1rem; font-weight: 700; padding: 14px;
  border: 0; border-radius: 10px; background: #2f7f5f; color: #fff; cursor: pointer;
}
.pass-gate-msg { color: #ff8f8f !important; margin: 12px 0 0 !important; font-size: 0.9rem !important; }
</style>
</head>
<body>
<a class="help-button" href="help/使い方.html">？使い方</a>
<div class="map-container">
  <div class="map-stage" id="mapStage">
  <img src="map.jpg" alt="地図" class="map-image">
  </div>
</div>
<script>
var MAP_BOUNDS = { topLeft: { lat: 33.18377, lng: 131.761211 }, bottomRight: { lat: 33.182981, lng: 131.762569 } };
var MAP_LINEAR = false;
var MAP_INSETS = { left: 0, top: 0, right: 0, bottom: 0 };
var MAP_PIN_OFFSET = { x: 0, y: 0 };
var MAP_TWO_POINT = null;
function mercatorY(lat) { var r = lat * Math.PI / 180; return Math.log(Math.tan(Math.PI / 4 + r / 2)); }
function gpsToPercent(lat, lng) {
  var x, y, bounds = MAP_BOUNDS, tp = MAP_TWO_POINT;
  if (tp && tp.p1 && tp.p2) {
    var p1 = tp.p1, p2 = tp.p2;
    x = Math.abs(p2.lng - p1.lng) > 1e-12 ? p1.x + (lng - p1.lng) / (p2.lng - p1.lng) * (p2.x - p1.x) : p1.x;
    var y1 = mercatorY(p1.lat), y2 = mercatorY(p2.lat), ym = mercatorY(lat);
    if (Math.abs(y2 - y1) > 1e-12) { var s1 = p1.y / 100, s2 = p2.y / 100, sm = (ym - y1) / (y2 - y1); y = (s1 + sm * (s2 - s1)) * 100; } else { y = p1.y; }
  } else if (MAP_LINEAR) {
    var lngSpan = bounds.bottomRight.lng - bounds.topLeft.lng;
    var latSpan = bounds.topLeft.lat - bounds.bottomRight.lat;
    x = lngSpan ? (lng - bounds.topLeft.lng) / lngSpan * 100 : 0;
    y = latSpan ? (bounds.topLeft.lat - lat) / latSpan * 100 : 0;
  } else {
    var lngSpan = bounds.bottomRight.lng - bounds.topLeft.lng;
    var yTop = mercatorY(bounds.topLeft.lat), yBot = mercatorY(bounds.bottomRight.lat);
    x = lngSpan ? (lng - bounds.topLeft.lng) / lngSpan * 100 : 0;
    y = (yTop - yBot) ? (yTop - mercatorY(lat)) / (yTop - yBot) * 100 : 0;
  }
  var il = MAP_INSETS.left || 0, it = MAP_INSETS.top || 0, ir = MAP_INSETS.right || 0, ib = MAP_INSETS.bottom || 0;
  x = il + x * (100 - il - ir) / 100;
  y = it + y * (100 - it - ib) / 100;
  x += (MAP_PIN_OFFSET.x || 0); y += (MAP_PIN_OFFSET.y || 0);
  return { x: x, y: y };
}
var VIEWER_BUILD = '2026-07-09-ios1';
var PINS = [

  // Pin #1: 白山神社 (aa - sceneId: 0-aa001)
  { lat: 33.183099, lng: 131.762183, name: '白山神社', sceneId: '0-aa001', color: '#e8453c', rowNum: 1 },

  // Pin #10: 展望台 (aa - sceneId: 9-aa010)
  { lat: 33.183474, lng: 131.761758, name: '展望台', sceneId: '9-aa010', color: '#e8453c', rowNum: 10 }
];

var SIDE_BRANCHES = [];

function spreadPinPositions(pins) {
  var positions = pins.map(function(pin) { return { pin: pin, pos: gpsToPercent(pin.lat, pin.lng) }; });
  var groups = {};
  positions.forEach(function(item, i) {
    var k = item.pin.lat.toFixed(6) + ',' + item.pin.lng.toFixed(6);
    if (!groups[k]) groups[k] = [];
    groups[k].push(i);
  });
  Object.keys(groups).forEach(function(k) {
    var idxs = groups[k];
    if (idxs.length <= 1) return;
    var r = 1.8;
    idxs.forEach(function(pi, j) {
      var a = (2 * Math.PI * j) / idxs.length - Math.PI / 2;
      positions[pi].pos.x += Math.cos(a) * r;
      positions[pi].pos.y += Math.sin(a) * r;
    });
  });
  positions.forEach(function(item) {
    item.pos.x += parseFloat(item.pin.mapOffsetX || 0) || 0;
    item.pos.y += parseFloat(item.pin.mapOffsetY || 0) || 0;
  });
  return positions;
}

function goToScene(pin) {
  var url = './viewer.html?id=' + pin.sceneId;
  if (pin.flip) url += '&flip=1';
  if (SIDE_BRANCHES.length > 0) {
    url += '&sideBranches=' + encodeURIComponent(JSON.stringify(SIDE_BRANCHES));
  }
  url += '&back=./map.html&v=' + encodeURIComponent(VIEWER_BUILD);
  window.location.href = url;
}

var container = document.getElementById('mapStage');
function getMapEntryIndexes(total) {
  var allIdx = [];
  for (var gi = 0; gi < total; gi++) allIdx.push(gi);
  return allIdx;
}
function renderMapEntry() {
  if (!PINS.length) return;
  var spread = spreadPinPositions(PINS);
  var idxs = getMapEntryIndexes(PINS.length);
  var labels = {};
  labels[0] = 'スタート';
  if (PINS.length >= 3) {
    labels[Math.floor((PINS.length - 1) / 2)] = '途中';
    labels[PINS.length - 1] = 'ゴール';
  } else if (PINS.length === 2) {
    labels[1] = 'ゴール';
  }
  idxs.forEach(function(i) {
    var item = spread[i];
    if (!item || !isFinite(item.pin.lat) || !isFinite(item.pin.lng)) return;
    var el = document.createElement('div');
    el.className = 'map-entry-pin';
    el.style.left = item.pos.x + '%';
    el.style.top = item.pos.y + '%';
    var short = String((item.pin.rowNum != null ? item.pin.rowNum : (i + 1)));
    var name = item.pin.name || ('' + (i + 1));
    var side = item.pin.labelSide || 'bottom';
    if (side !== 'left' && side !== 'right' && side !== 'top' && side !== 'bottom') side = 'bottom';
    el.innerHTML = '<div class="map-entry-dot" style="background:' + item.pin.color + ';">' + short + '</div><div class="map-entry-label is-' + side + '">' + name + '</div>';
    el.addEventListener('click', function() { goToScene(PINS[i]); });
    container.appendChild(el);
  });
}
renderMapEntry();
</script>
</body>
</html>
